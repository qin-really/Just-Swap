<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JustSwap</title>
<style>
  :root {
    color-scheme: light;
    --bg:#e7eaf0;
    --surface:#f3f5f9;
    --surface-2:#fbfcfe;
    --ink:#1a1d24;
    --ink-2:#5c6373;
    --ink-3:#8b93a3;
    --accent:#57ade6;
    --danger:#dc2626;
    --line:rgba(16,24,40,.1);
    --r:8px;
    --r-sm:6px;
    --r-xs:4px;
    --sh:5px 5px 12px rgba(16,24,40,.08),-5px -5px 12px rgba(255,255,255,.92);
    --sh-md:6px 6px 10px rgba(16,24,40,.15),-5px -5px 10px rgba(255,255,255,.93),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 1px rgba(16,24,40,.05);
    --sh-lg:9px 9px 22px rgba(16,24,40,.13),-9px -9px 20px rgba(255,255,255,.95);
    --sh-hv:9px 9px 13px rgba(16,24,40,.21),-7px -7px 13px rgba(255,255,255,.96),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 1px rgba(16,24,40,.06);
    --sh-in:inset 3px 3px 7px rgba(16,24,40,.07),inset -3px -3px 7px rgba(255,255,255,.85);
    --ease:cubic-bezier(.2,.8,.3,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; padding: clamp(1rem, 3.5vw, 2.25rem);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    background-color: var(--bg);
  }
  .wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 1.15rem; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topbar {
    display: flex; flex-direction: column; gap: .65rem;
    padding: .8rem .95rem; border-radius: var(--r); color: #fff;
    background-color: #2993d1;
    box-shadow: 7px 7px 18px rgba(77, 30, 95, 0.28), -6px -6px 14px rgba(255,255,255,.6);
  }
  .bar-main { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
  .bar-settings { display: flex; align-items: center; gap: .55rem 1.1rem; flex-wrap: wrap; margin-top: -.85rem; }

  /* Custom dropdown. A native <select> popup is a browser widget: no animation,
     no radius, no shadow. #retention stays in the DOM as the data source. */
  .pick { position: relative; display: inline-flex; }
  .pick-btn {
    display: inline-flex; align-items: center; gap: .45rem;
    font: inherit; font-size: .85rem; color: var(--ink); font-weight: 560;
    background-color: transparent; border: 0; padding: .3rem .55rem;
    border-radius: var(--r-xs); cursor: pointer;
    transition: background-color .18s var(--ease);
  }
  .pick-btn:hover { background-color: rgba(16,24,40,.07); }
  .pick-btn:active { background-color: rgba(16,24,40,.12); }
  .pick-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick-arrow { width: 10px; height: 6px; color: var(--ink-3); flex: none; transition: transform .26s var(--spring); }
  .pick[data-open] .pick-arrow { transform: rotate(180deg); }
  .pick-pop {
    position: absolute; top: calc(100% + .3rem); left: -.2rem; z-index: 30;
    min-width: 8ch; padding: .25rem;
    background-color: var(--surface-2); border-radius: var(--r-sm);
    box-shadow: var(--sh-lg); display: none;
  }
  .pick[data-open] .pick-pop { display: block; animation: pop .22s var(--spring); transform-origin: top left; }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.94); } }
  .pick-item {
    padding: .4rem .65rem; border-radius: var(--r-xs);
    font-size: .85rem; color: var(--ink); cursor: pointer; white-space: nowrap;
    transition: background-color .14s var(--ease), transform .14s var(--ease), color .14s var(--ease);
  }
  .pick-item:hover { background-color: rgba(78,173,236,.15); }
  .pick-item[aria-current="true"] { background-color: var(--accent); color: #fff; }
  .hidden-src { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  .bar-settings label {
    display: inline-flex; align-items: center; gap: .45rem;
    font-size: .85rem; color: #424242; opacity: .95;
  }
  .brand { display: flex; align-items: center; gap: .55rem; font-weight: 650; letter-spacing: .01em; }
  .brand svg { width: 20px; height: 20px; flex: none; }
  .addr {
    font-family: ui-monospace, Consolas, monospace; font-size: .82em; opacity: .9;
    padding: .18em .55em; background: rgba(255,255,255,.14); border-radius: var(--r-xs);
  }
  .notice { margin-left: auto; color: #fff; opacity: .85; font-size: .78rem; letter-spacing: .01em; }

  .panel { border-radius: var(--r); background: var(--surface); box-shadow: var(--sh); padding: 1.15rem; }

  .drop {
    text-align: center; padding: 2.4rem 1.2rem 1.9rem;
    transition: box-shadow .22s var(--ease), background-color .2s var(--ease);
  }
  .drop.over {
    background-color: var(--surface-2);
    box-shadow: var(--sh-lg), 0 0 0 2px rgba(79,70,229,.4);
  }
  .drop .icon {
    width: 62px; height: 62px; margin: 0 auto .9rem; display: grid; place-items: center;
    border-radius: 10px; background-color: var(--surface-2); box-shadow: var(--sh-in);
    color: var(--accent); transition: transform .3s var(--spring);
  }
  .drop.over .icon { transform: rotate(-5deg); }
  .drop .icon svg { width: 29px; height: 29px; }
  .drop .t { margin: 0 0 .3rem; font-size: 1.05rem; font-weight: 640; }
  .drop .s { margin: 0 0 1.15rem; color: var(--ink-2); font-size: .87rem; }
  .qr { margin: 0 auto 1rem; text-align: center; }
  .qr svg {
    width: 136px; height: 136px; padding: 8px; background: #fff;
    border-radius: var(--r-sm); box-shadow: var(--sh-md);
  }
  .qr-toggle { margin: 0 auto 1.1rem; font-size: .82rem; color: var(--ink-2); }
  select, button, a.btn {
    font: inherit; font-size: .87rem; color: var(--ink);
    background-color: var(--surface-2); border: 0; border-radius: var(--r-sm);
    padding: .42rem .8rem; cursor: pointer; box-shadow: var(--sh); text-decoration: none;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), background-color .18s var(--ease);
  }
  select {
    padding-right: 2rem; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%235c6373' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right .7rem center;
  }
  select:hover, button:hover, a.btn:hover { box-shadow: var(--sh-lg); }
  select:active, button:active, a.btn:active { transform: translateY(1px); box-shadow: var(--sh-in); }
  .primary {
    color: #fff; background-color: var(--accent);
    box-shadow: 5px 5px 14px rgba(79,70,229,.3), -4px -4px 10px rgba(255,255,255,.85);
  }
  .primary:hover { box-shadow: 8px 8px 20px rgba(79,70,229,.42), -4px -4px 10px rgba(255,255,255,.85); }
  .ghost { background-color: transparent; box-shadow: var(--sh-in); }
  .danger { color: var(--danger); }
  .danger:hover { background-color: #fdeceb; }
  .tiny { padding: .28rem .55rem; font-size: .8rem; border-radius: var(--r-xs); }

  .switch { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track {
    position: relative; width: 38px; height: 20px; border-radius: 5px;
    background-color: var(--surface-2); box-shadow: var(--sh-in);
    transition: background-color .25s var(--ease);
  }
  .knob {
    position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 3px;
    background-color: var(--ink-3); box-shadow: 1px 1px 3px rgba(0,0,0,.25);
    transition: transform .32s var(--spring), background-color .2s var(--ease);
  }
  .switch input:checked + .track { background-color: var(--accent); }
  .switch input:checked + .track .knob { transform: translateX(18px); background-color: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .list-head { display: flex; align-items: center; gap: .5rem .75rem; flex-wrap: wrap; margin-bottom: .85rem; }
  .list-head h2 { font-size: .95rem; margin: 0; display: flex; align-items: center; gap: .5rem; font-weight: 640; }
  .count {
    font-size: .72rem; color: var(--ink-2); font-variant-numeric: tabular-nums;
    background-color: var(--surface-2); box-shadow: var(--sh-in); padding: .14em .55em; border-radius: var(--r-xs);
  }
  .base { color: var(--ink-3); font-size: .79rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { margin-left: auto; }

  .rows { display: grid; gap: .55rem; margin: 0; padding: 0; list-style: none; }
  .row {
    display: grid; grid-template-columns: minmax(0,1fr) auto auto auto; align-items: center;
    gap: .5rem .8rem; padding: .6rem .75rem; border-radius: var(--r-sm);
    background-color: var(--surface-2); border: 1px solid var(--line); box-shadow: var(--sh-md);
    transition: box-shadow .2s var(--ease);
    animation: rise .24s var(--ease) both;
  }
  .row:hover { box-shadow: var(--sh-hv); }
  .row.uploading { animation: rise .3s var(--spring) both; grid-template-columns: minmax(0,1fr) auto; }
  .prog { display: inline-flex; align-items: center; gap: .55rem; white-space: nowrap; }
  .drop > .row { margin-top: .65rem; text-align: left; }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } }
  .row.out { animation: shrink .24s var(--ease) forwards; }
  @keyframes shrink { to { opacity: 0; transform: translateX(-26px) scale(.97); } }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 560; font-size: .9rem; }
  .meta { color: var(--ink-2); font-size: .8rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meta.dim { color: var(--ink-3); }
  .acts { display: flex; gap: .35rem; white-space: nowrap; }
  .bar { width: 96px; height: 6px; border-radius: 3px; background-color: var(--surface); box-shadow: var(--sh-in); overflow: hidden; }
  .bar > div {
    height: 100%; width: 0; border-radius: 3px; position: relative; overflow: hidden;
    background-color: var(--accent); transition: width .18s var(--ease);
  }
  .bar > div::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -38%; width: 38%;
    background-color: rgba(255,255,255,.45);
    animation: sweep 1.1s linear infinite;
  }
  @keyframes sweep { from { left: -38%; } to { left: 100%; } }
  .empty {
    text-align: center; color: var(--ink-3);
    padding: 2.2rem 1rem; font-size: .88rem; background-color: var(--surface); box-shadow: var(--sh-in);
  }
  .empty svg { display: block; width: 34px; height: 34px; margin: 0 auto .7rem; opacity: .55; animation: float 3.6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  #toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; max-width: 34ch; z-index: 20; }
  .toast {
    background-color: var(--surface-2); border-radius: var(--r-sm); padding: .55rem .85rem;
    font-size: .85rem; box-shadow: var(--sh-lg); animation: slide .34s var(--spring);
  }
  .toast.err { box-shadow: var(--sh-lg), inset 3px 0 0 var(--danger); }
  @keyframes slide { from { opacity: 0; transform: translateX(30px) scale(.96); } }

  @media (max-width: 620px) {
    .topbar { padding: .65rem .8rem; gap: .55rem; }
    .notice { display: none; }
    .panel { padding: .95rem; }
    .drop { padding: 1.7rem .9rem 1.35rem; }
    .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .7rem; }
    .row .name { flex: 1 1 100%; }
    .row .meta { flex: 0 0 auto; }
    .row .bar { flex: 1 1 100%; }
    .row .prog { flex: 1 1 100%; justify-content: flex-end; }
    .row .acts { flex: 1 1 100%; justify-content: flex-end; }
    #toasts { left: 1rem; right: 1rem; max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="bar-main">
      <span class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3.2-3.2"/><path d="M20 17H7l3.2 3.2"/></svg>
        JustSwap
      </span>
      <span class="addr" id="addr"></span>
      <span class="notice">开放访问 · 无认证</span>
    </div>
  </header>

  <div class="bar-settings">
    <label>保留时长：
      <div class="pick" id="pickWrap">
        <button class="pick-btn" id="pickBtn" type="button" style="background-color:transparent;transition:none;transform:none;box-shadow:none;outline:none;cursor:pointer;">
          <span class="pick-val" id="pickVal"></span>
          <svg class="pick-arrow" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg>
        </button>
        <div class="pick-pop" id="pickPop"></div>
      </div>
    </label>
    <select id="retention" class="hidden-src"></select>
    <label class="switch">
      <input type="checkbox" id="clearDown">
      <span class="track"><span class="knob"></span></span>
      <span>关闭服务器时清空文件</span>
    </label>
  </div>
  <section class="panel drop" id="drop">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4.5"/><path d="M7.2 9.3 12 4.5l4.8 4.8"/><path d="M4 17.5v1.7a1.3 1.3 0 0 0 1.3 1.3h13.4a1.3 1.3 0 0 0 1.3-1.3v-1.7"/></svg>
    </div>
    <p class="t">拖拽文件到这里</p>
    <p class="s">局域网内任何浏览器都可以访问</p>
    <div class="qr" id="qrWrap" hidden></div>
    <label class="switch qr-toggle">
      <input type="checkbox" id="qrToggle">
      <span class="track"><span class="knob"></span></span>
      <span>显示二维码</span>
    </label>
    <button class="primary" id="pick">选择文件</button>
    <input type="file" id="file" multiple hidden accept="*/*">
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>文件 <span class="count" id="count">0</span></h2>
      <span class="base" id="base"></span>
      <span class="spacer"></span>
      <button id="clearAll" class="tiny danger ghost">清空全部</button>
    </div>
    <ul class="rows" id="rows"></ul>
  </section>
</div>

<div id="toasts"></div>
<script src="qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const TRAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13 6 5.8a1.8 1.8 0 0 1 1.7-1.3h8.6A1.8 1.8 0 0 1 18 5.8L20.5 13v5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18v-5z"/><path d="M3.5 13h4.6l1.1 2h5.6l1.1-2h4.6"/></svg>';

// A native <select> popup is a browser widget: no animation, no radius, no shadow.
// #retention stays in the DOM as the source of truth so renderMeta and its
// onchange handler keep working untouched. This mirrors it into an animatable
// widget; a MutationObserver picks up option rebuilds without touching renderMeta.
const pick = {
  el: null, btn: null, pop: null, val: null,
  init() {
    this.el = $('#pickWrap'); this.btn = $('#pickBtn');
    this.pop = $('#pickPop'); this.val = $('#pickVal');
    this.sync();
    new MutationObserver(() => this.sync()).observe($('#retention'), {
      childList: true, attributes: true, subtree: true,
    });
    this.btn.onclick = e => { e.stopPropagation(); this.toggle(); };
    this.pop.onclick = e => {
      const it = e.target.closest('.pick-item');
      if (it) this.choose(it.dataset.v);
    };
    document.addEventListener('click', () => this.close());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') this.close(); });
  },
  sync() {
    const sel = $('#retention');
    const opts = [...sel.options].map(o => ({v: o.value, t: o.textContent}));
    const cur = String(sel.value);
    this.pop.innerHTML = opts.map(o =>
      '<div class="pick-item" data-v="' + esc(o.v) + '"' +
      (o.v === cur ? ' aria-current="true"' : '') + '>' + esc(o.t) + '</div>').join('');
    const hit = opts.find(o => o.v === cur);
    this.val.textContent = hit ? hit.t : '';
  },
  toggle() { if (this.el.dataset.open) this.close(); else this.el.dataset.open = '1'; },
  close() { delete this.el.dataset.open; },
  choose(v) {
    const sel = $('#retention');
    sel.value = v;
    this.close();
    this.sync();
    sel.dispatchEvent(new Event('change', {bubbles: true}));
  },
};

const RETENTIONS = [[60,'1 分钟'],[600,'10 分钟'],[3600,'1 小时'],[21600,'6 小时'],
                    [86400,'24 小时'],[604800,'7 天']];

let meta = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { msg = (await res.json()).message || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res;
}

function toast(msg, isErr) {
  const d = document.createElement('div');
  d.className = 'toast' + (isErr ? ' err' : '');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(() => d.remove(), 4000);
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

function fmtLeft(sec) {
  if (sec <= 0) return '已过期';
  if (sec < 60) return sec + ' 秒后';
  if (sec < 3600) return Math.round(sec / 60) + ' 分钟后';
  if (sec < 86400) return Math.round(sec / 3600) + ' 小时后';
  return Math.round(sec / 86400) + ' 天后';
}

function fileRow(f) {
  const row = document.createElement('li');
  row.className = 'row';
  row.innerHTML =
    '<span class="name" title="' + esc(f.name) + '">' + esc(f.name) + '</span>' +
    '<span class="meta">' + fmtSize(f.size) + '</span>' +
    '<span class="meta dim">' + new Date(f.uploadedAt).toLocaleString('zh-CN') + '</span>' +
    '<span class="meta dim">' + fmtLeft(f.expiresIn) + '</span>' +
    '<span class="acts">' +
      '<a class="btn tiny" href="/api/download?name=' + encodeURIComponent(f.name) + '">下载</a>' +
      '<button class="btn tiny danger" data-del="' + esc(f.name) + '">删除</button>' +
    '</span>';
  row.querySelector('[data-del]').onclick = () => {
    row.classList.add('out');
    setTimeout(() => removeFile(f.name), 210);
  };
  return row;
}

// Upload rows live in #drop, not in this list, so a plain rebuild can't drop an
// in-flight upload: nothing here is known only to the client.
function renderFiles(files) {
  $('#count').textContent = files.length;
  const body = $('#rows');
  body.innerHTML = '';
  if (!files.length) {
    body.innerHTML = '<li class="empty">' + TRAY + '还没有文件 — 拖拽到上方开始</li>';
  }
  for (const f of files) body.appendChild(fileRow(f));
}

// QR is rendered in the browser from the address the peer actually opened —
// location.origin is always the right host and the actual (possibly bumped)
// port. Shown by default on the server machine, hidden elsewhere; the toggle
// overrides it and only the first meta sets the default so SSE refreshes never
// fight the user's choice.
let qrInit = false;
function makeQR() {
  const q = qrcode(0, 'M');
  q.addData(location.origin);
  q.make();
  $('#qrWrap').innerHTML = q.createSvgTag(10, 0);
}
function applyQR() {
  $('#qrWrap').hidden = !$('#qrToggle').checked;
}
function renderMeta() {
  if (!meta) return;
  $('#addr').textContent = 'http://' + location.host;
  $('#base').textContent = meta.baseDir || '';
  $('#clearDown').checked = !!meta.clearOnShutdown;
  if (!qrInit) {
    makeQR();
    $('#qrToggle').checked = !!meta.local;
    qrInit = true;
    applyQR();
  }
  const sel = $('#retention');
  const cur = meta.retentionSeconds;
  const opts = RETENTIONS.some(([v]) => v === cur)
    ? RETENTIONS
    : RETENTIONS.concat([[cur, Math.round(cur / 3600 * 10) / 10 + ' 小时']]);
  sel.innerHTML = '';
  for (const [v, label] of opts) {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = label;
    if (v === cur) o.selected = true;
    sel.appendChild(o);
  }
}
async function refresh() {
  try {
    renderFiles(((await (await api('/api/files')).json()).files) || []);
    meta = await (await api('/api/meta')).json();
    renderMeta();
  } catch (e) {
    toast('无法连接服务器: ' + e.message, true);
  }
}

async function removeFile(name) {
  try {
    await api('/api/files?name=' + encodeURIComponent(name), {method: 'DELETE'});
    toast('已删除 ' + name);
    refresh();
  } catch (e) { toast('删除失败: ' + e.message, true); }
}

async function clearAll() {
  try {
    const j = await (await api('/api/clear', {method: 'POST'})).json();
    toast('已清空 ' + j.removed + ' 个文件');
    refresh();
  } catch (e) { toast('清空失败: ' + e.message, true); }
}

async function saveSettings(body) {
  try {
    meta = await (await api('/api/settings', {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    })).json();
    renderMeta();
    refresh();
  } catch (e) { toast('设置保存失败: ' + e.message, true); }
}

// XHR rather than fetch: fetch cannot report upload progress.
function uploadOne(f, onProg) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?name=' + encodeURIComponent(f.name));
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProg(e.loaded / e.total, e.loaded); };
    xhr.onloadend = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { resolve(null); }
      } else {
        let msg = 'HTTP ' + xhr.status;
        try { msg = JSON.parse(xhr.responseText).message || msg; } catch (e) {}
        reject(new Error(msg));
      }
    };
    xhr.send(f);
  });
}

function uploadRow(f) {
  const row = document.createElement('li');
  row.className = 'row uploading';
  row.innerHTML =
    '<span class="name" title="' + esc(f.name) + '">' + esc(f.name) + '</span>' +
    '<span class="prog">' +
      '<span class="bar"><div></div></span>' +
      '<span class="meta dim prog-txt">0% · 0 B/s</span>' +
    '</span>';
  $('#drop').appendChild(row);
  return row;
}

async function uploadMany(files) {
  if (!files.length) return;
  for (const f of files) {
    const row = uploadRow(f);
    const bar = row.querySelector('.bar > div');
    const txt = row.querySelector('.prog-txt');
    const t0 = performance.now();
    try {
      await uploadOne(f, (p, loaded) => {
        bar.style.width = Math.round(p * 100) + '%';
        const s = (performance.now() - t0) / 1000;
        txt.textContent = Math.round(p * 100) + '%  ·  ' +
          (s > 0 ? fmtSize(Math.round(loaded / s)) : '0 B') + '/s';
      });
      row.remove();
    } catch (e) {
      row.querySelector('.bar').style.display = 'none';
      txt.textContent = '失败';
      toast('上传失败 ' + f.name + ': ' + e.message, true);
      setTimeout(() => row.remove(), 3000);
    }
  }
  refresh();
}

// Re-fetch on every event rather than applying a diff: the list is small and a
// full refetch makes reconnect trivially correct.
function connectSSE() {
  const es = new EventSource('/api/events');
  es.addEventListener('files', refresh);
  es.addEventListener('settings', refresh);
  es.addEventListener('hello', refresh);
  es.onerror = () => {}; // EventSource reconnects by itself
}

document.addEventListener('DOMContentLoaded', () => {
  refresh();
  connectSSE();
  pick.init();

  $('#pick').onclick = () => $('#file').click();
  $('#file').onchange = e => { uploadMany([...e.target.files]); e.target.value = ''; };

  const drop = $('#drop');
  for (const ev of ['dragenter', 'dragover']) {
    document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); });
  }
  document.addEventListener('dragleave', e => {
    if (e.relatedTarget === null) drop.classList.remove('over');
  });
  document.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    uploadMany([...(e.dataTransfer.files || [])]);
  });

  $('#retention').onchange = e => saveSettings({retentionSeconds: +e.target.value});
  $('#clearDown').onchange = e => saveSettings({clearOnShutdown: e.target.checked});
  $('#qrToggle').onchange = applyQR;
  $('#clearAll').onclick = clearAll;
});
</script>
